version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: amqp-broker
    ports:
      - "5672:5672"     # AMQP broker port
      - "15672:15672"   # RabbitMQ management dashboard port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - JWT_SECRET=super-secret-msc-project-key-value
      - USER_SERVICE_URL=http://user-service:7001
      - CATALOG_SERVICE_URL=http://catalog-service:7002
      - INVENTORY_SERVICE_URL=http://inventory-service:7003
      - ORDER_SERVICE_URL=http://order-service:7004
      - PAYMENT_SERVICE_URL=http://payment-service:7005
    depends_on:
      - user-service
      - catalog-service
      - inventory-service
      - order-service
      - payment-service

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      - PORT=7001
      - DATABASE_URL=data/users.db
      - JWT_SECRET=super-secret-msc-project-key-value
    volumes:
      - user_db_vol:/app/data
    ports:
      - "7001:7001"

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-service
    environment:
      - PORT=7002
      - DATABASE_URL=data/catalog.db
    volumes:
      - catalog_db_vol:/app/data
    ports:
      - "7002:7002"

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    environment:
      - PORT=7003
      - DATABASE_URL=data/inventory.db
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - inventory_db_vol:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "7003:7003"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    environment:
      - PORT=7004
      - DATABASE_URL=data/orders.db
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672/
      - CATALOG_SERVICE_URL=http://catalog-service:7002
    volumes:
      - order_db_vol:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started
    ports:
      - "7004:7004"

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    environment:
      - PORT=7005
      - DATABASE_URL=data/payments.db
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - payment_db_vol:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "7005:7005"

volumes:
  rabbitmq_data:
  user_db_vol:
  catalog_db_vol:
  inventory_db_vol:
  order_db_vol:
  payment_db_vol:
