apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  replicas: 1 # State consistency usually requires single replicas or database synchronization
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: ecommerce-inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7003
          env:
            - name: PORT
              value: "7003"
            - name: DATABASE_URL
              value: "inventory.db"
            - name: AMQP_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: AMQP_URL
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  ports:
    - port: 7003
      targetPort: 7003
  selector:
    app: inventory-service
  type: ClusterIP
