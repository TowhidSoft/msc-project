apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: ecommerce-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7005
          env:
            - name: PORT
              value: "7005"
            - name: DATABASE_URL
              value: "payments.db"
            - name: AMQP_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: AMQP_URL
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  ports:
    - port: 7005
      targetPort: 7005
  selector:
    app: payment-service
  type: ClusterIP
