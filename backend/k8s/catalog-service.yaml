apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: ecommerce-catalog-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7002
          env:
            - name: PORT
              value: "7002"
            - name: DATABASE_URL
              value: "catalog.db"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  ports:
    - port: 7002
      targetPort: 7002
  selector:
    app: catalog-service
  type: ClusterIP
