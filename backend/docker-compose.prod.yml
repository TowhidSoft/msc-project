
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: amqp-broker
    # No host ports — RabbitMQ is only reachable inside Docker network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user-service:8001
      - CATALOG_SERVICE_URL=http://catalog-service:8002
      - INVENTORY_SERVICE_URL=http://inventory-service:8003
      - ORDER_SERVICE_URL=http://order-service:8004
      - PAYMENT_SERVICE_URL=http://payment-service:8005
    depends_on:
      - user-service
      - catalog-service
      - inventory-service
      - order-service
      - payment-service
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      - PORT=8001
      - DATABASE_URL=data/users.db
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - user_db_vol:/app/data
    # No host ports — only reachable by api-gateway inside Docker network
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-service
    environment:
      - PORT=8002
      - DATABASE_URL=data/catalog.db
    volumes:
      - catalog_db_vol:/app/data
    # No host ports — only reachable inside Docker network
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    environment:
      - PORT=8003
      - DATABASE_URL=data/inventory.db
      - AMQP_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    volumes:
      - inventory_db_vol:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    # No host ports — only reachable inside Docker network
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    environment:
      - PORT=8004
      - DATABASE_URL=data/orders.db
      - AMQP_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - CATALOG_SERVICE_URL=http://catalog-service:8002
    volumes:
      - order_db_vol:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started
    # No host ports — only reachable inside Docker network
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    environment:
      - PORT=8005
      - DATABASE_URL=data/payments.db
      - AMQP_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    volumes:
      - payment_db_vol:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    # No host ports — only reachable inside Docker network
    restart: unless-stopped

volumes:
  rabbitmq_data:
  user_db_vol:
  catalog_db_vol:
  inventory_db_vol:
  order_db_vol:
  payment_db_vol:
