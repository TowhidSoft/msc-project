name: CI - Go Backend Tests

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"

jobs:
  test:
    name: Run Go Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.work.sum

      - name: Sync Go Workspace
        run: go work sync

      - name: Run User Service Tests
        working-directory: backend/user-service
        run: go test -v -count=1 ./...

      - name: Run Catalog Service Tests
        working-directory: backend/catalog-service
        run: go test -v -count=1 ./...

      - name: Run Inventory Service Tests
        working-directory: backend/inventory-service
        run: go test -v -count=1 ./...

      - name: Run Payment Service Tests
        working-directory: backend/payment-service
        run: go test -v -count=1 ./...

      - name: Run Order Service Tests
        working-directory: backend/order-service
        run: go test -v -count=1 ./...

      - name: Run API Gateway Tests
        working-directory: backend/api-gateway
        run: go test -v -count=1 ./...

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/api-gateway/Dockerfile
          push: false
          tags: ecommerce-api-gateway:latest

      - name: Build User Service image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/user-service/Dockerfile
          push: false
          tags: ecommerce-user-service:latest

      - name: Build Catalog Service image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/catalog-service/Dockerfile
          push: false
          tags: ecommerce-catalog-service:latest

      - name: Build Inventory Service image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/inventory-service/Dockerfile
          push: false
          tags: ecommerce-inventory-service:latest

      - name: Build Order Service image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/order-service/Dockerfile
          push: false
          tags: ecommerce-order-service:latest

      - name: Build Payment Service image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/payment-service/Dockerfile
          push: false
          tags: ecommerce-payment-service:latest
